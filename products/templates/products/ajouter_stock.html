<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ajouter un stock - AgriMarket</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background-color: #f6faf8;
        }

        .header {
            background-color: #087443;
            color: white;
            padding: 20px;
        }

        .form-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0, 80, 40, 0.07);
        }

        .title {
            color: #087443;
            font-weight: 700;
        }

        .btn-green {
            background-color: #087443;
            color: white;
            border: none;
        }

        .btn-green:hover {
            background-color: #065c35;
            color: white;
        }

    </style>

</head>


<body>


<div class="header">

    <div class="container">

        <h4>
            Ajouter un stock
        </h4>

        <small>
            Enregistrer une disponibilité
        </small>

    </div>

</div>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="form-card p-4">

                <h3 class="title mb-4">
                    Informations du stock
                </h3>


                <form method="post">

                    {% csrf_token %}


                    <div class="mb-3">

                        <label class="form-label">
                            Producteur
                        </label>

                        {{ form.producteur }}

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Produit
                        </label>

                        {{ form.produit }}

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Quantité disponible
                        </label>

                        {{ form.quantite }}

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Prix d'achat
                        </label>

                        {{ form.prix_unitaire }}

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Prix supermarché
                        </label>

                        {{ form.prix_supermarche }}

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            Prix particulier
                        </label>

                        {{ form.prix_particulier }}

                    </div>


                    <button type="submit"
                            class="btn btn-green">

                        Enregistrer le stock

                    </button>


                    <a href="{% url 'liste_stocks' %}"
                       class="btn btn-outline-secondary">

                        Annuler

                    </a>


                </form>

            </div>

        </div>

    </div>

</div>


</body>

</html>
