
<!DOCTYPE html>
<html lang="fr">

<head>
   <meta charset="UTF-8">
   <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Connexion - AgriUNCHK</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f8f4;
        }

        /* =========================
           PAGE
        ========================= */

        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;

            background:
                radial-gradient(circle at 10% 20%,
                    rgba(25, 135, 84, 0.12),
                    transparent 30%),

                radial-gradient(circle at 90% 80%,
                    rgba(20, 108, 67, 0.12),
                    transparent 30%),

                #f2f8f4;
        }


        /* =========================
           CARD
        ========================= */

        .login-card {

            width: 100%;
            max-width: 520px;

            background: white;

            border-radius: 24px;

            padding: 45px 50px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.10);
        }


        /* =========================
           LOGO
        ========================= */

        .logo-box {

            width: 80px;
            height: 80px;

            margin: auto;

            border-radius: 50%;

            background: #e8f5ee;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #198754;

            font-size: 42px;
        }


        .brand-name {

            color: #146c43;

            font-size: 34px;

            font-weight: 800;

            margin-top: 15px;
        }

        .brand-name span {
            color: #198754;
        }


        .subtitle {

            color: #6c757d;

            font-size: 16px;

            margin-bottom: 35px;
        }


        /* =========================
           TITRES
        ========================= */

        .form-label {

            font-weight: 600;

            color: #146c43;
        }


        /* =========================
           INPUT
        ========================= */

        .input-group {

            margin-bottom: 20px;
        }


        .input-group-text {

            background: #f8fbf9;

            border: 1px solid #dce8e1;

            color: #198754;

            font-size: 19px;

            border-radius: 10px 0 0 10px;
        }


        .form-control {

            border: 1px solid #dce8e1;

            padding: 13px;

            border-radius: 0 10px 10px 0;

            box-shadow: none;
        }


        .form-control:focus {

            border-color: #198754;

            box-shadow: 0 0 0 3px rgba(25, 135, 84, 0.12);
        }


        /* =========================
           BOUTON
        ========================= */

        .btn-agri {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #198754,
                #146c43
            );

            color: white;

            font-size: 17px;

            font-weight: 700;

            transition: 0.2s;
        }


        .btn-agri:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(20, 108, 67, 0.25);

            color: white;
        }


        /* =========================
           LIEN
        ========================= */

        .auth-link {

            color: #198754;

            font-weight: 600;

            text-decoration: none;
        }


        .auth-link:hover {

            color: #146c43;

            text-decoration: underline;
        }


        /* =========================
           SEPARATEUR
        ========================= */

        .separator {

            display: flex;

            align-items: center;

            gap: 15px;

            margin: 30px 0;

            color: #999;
        }


        .separator::before,
        .separator::after {

            content: "";

            flex: 1;

            height: 1px;

            background: #e0e0e0;
        }


        /* =========================
           SECURITE
        ========================= */

        .security {

            margin-top: 30px;

            padding: 15px;

            border-radius: 12px;

            background: #f2f9f5;

            color: #146c43;

            font-size: 14px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 576px) {

            .login-card {

                padding: 35px 25px;

            }

            .brand-name {

                font-size: 28px;

            }

        }

    </style>

</head>


<body>


<div class="auth-page">


    <div class="login-card">


        <!-- LOGO -->

        <div class="text-center">

            <div class="logo-box">

                <i class="bi bi-flower1"></i>

            </div>


            <div class="brand-name">

                Agri<span>UNCHK</span>

            </div>


            <p class="subtitle">

                Connectez-vous à votre espace

            </p>

        </div>


        <!-- ERREUR -->

        {% if form.errors %}

            <div class="alert alert-danger">

                <i class="bi bi-exclamation-circle"></i>

                Nom d'utilisateur ou mot de passe incorrect.

            </div>

        {% endif %}


        <!-- FORMULAIRE -->

        <form method="post">

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="mb-3">

                <label class="form-label">

                    <i class="bi bi-person-fill"></i>

                    Nom d'utilisateur

                </label>


                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-person"></i>

                    </span>


                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Entrez votre nom d'utilisateur"
                        required
                        autofocus
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="mb-4">

                <label class="form-label">

                    <i class="bi bi-lock-fill"></i>

                    Mot de passe

                </label>


                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-lock"></i>

                    </span>


                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Entrez votre mot de passe"
                        required
                    >

                </div>

            </div>


            <!-- BOUTON -->

            <button type="submit"
                    class="btn-agri">

                <i class="bi bi-box-arrow-in-right"></i>

                Se connecter

            </button>


        </form>


        <!-- SEPARATEUR -->

        <div class="separator">

            ou

        </div>


        <!-- INSCRIPTION -->

        <div class="text-center">

            <p class="text-muted mb-2">

                Vous n'avez pas encore de compte ?

            </p>


            <a href="{% url 'inscription' %}"
               class="auth-link">

                <i class="bi bi-person-plus"></i>

                Créer un compte

            </a>

        </div>


        


    </div>

</div>


</body>

</html>
