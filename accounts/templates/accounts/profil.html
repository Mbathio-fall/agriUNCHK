<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mon profil - AgriMarket</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background-color: #f5f9f6;
        }

        .navbar-agri {
            background-color: #146c43;
        }

        .profile-card {
            border: none;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .profile-icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: #e8f5ee;
            color: #198754;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: auto;
        }

        .title-agri {
            color: #146c43;
            font-weight: 700;
        }

        .info-box {
            background-color: #f8fbf9;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-agri py-3">

    <div class="container">

        <a href="{% url 'dashboard' %}"
           class="navbar-brand text-white fw-bold">

            🌱 AgriMarket

        </a>

        <form method="post"
              action="{% url 'logout' %}">

            {% csrf_token %}

            <button class="btn btn-light btn-sm">

                Déconnexion

            </button>

        </form>

    </div>

</nav>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card profile-card p-4">

                <div class="text-center">

                    <div class="profile-icon">

                        <i class="bi bi-person-fill"></i>

                    </div>

                    <h2 class="title-agri mt-3">

                        Mon profil

                    </h2>

                    <p class="text-muted">

                        Gérez vos informations personnelles.

                    </p>

                </div>

                <hr>


                <div class="info-box">

                    <strong>
                        <i class="bi bi-person"></i>
                        Nom d'utilisateur
                    </strong>

                    <div class="mt-1">
                        {{ user.username }}
                    </div>

                </div>


                <div class="info-box">

                    <strong>
                        <i class="bi bi-envelope"></i>
                        Adresse email
                    </strong>

                    <div class="mt-1">
                        {{ user.email|default:"Non renseignée" }}
                    </div>

                </div>


                <div class="info-box">

                    <strong>
                        <i class="bi bi-person-badge"></i>
                        Type de compte
                    </strong>

                    <div class="mt-1">

                        {{ user.get_role_display }}

                    </div>

                </div>


                <div class="text-center mt-3">

                    <a href="{% url 'dashboard' %}"
                       class="btn btn-success">

                        ← Retour au tableau de bord

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
